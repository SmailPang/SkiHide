name: Sync to CNB Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 GitHub Release Tag，例如 2.0.1 或 v2.0.1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sync-to-cnb:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Manual trigger tag: $TAG"
          else
            echo "Auto trigger from workflow_run"

            gh release list \
              --repo "$GH_REPO" \
              --limit 100 \
              --json tagName,name,isLatest,isPrerelease,isDraft,publishedAt \
              > releases.json

            TAG="$(jq -r '.[0].tagName' releases.json)"

            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "No release found"
              exit 1
            fi

            echo "Auto detected tag: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get GitHub Release info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"

          echo "Get GitHub release info: $TAG"

          gh release view "$TAG" \
            --repo "$GH_REPO" \
            --json tagName,name,body,url,assets,tarballUrl,zipballUrl,isPrerelease,isDraft \
            > release.json

          jq -r '.name // .tagName' release.json > release-name.txt
          jq -r '.body // ""' release.json > release-body.md
          jq -r '.zipballUrl' release.json > source-zip-url.txt
          jq -r '.tarballUrl' release.json > source-tar-url.txt

          echo "Release name:"
          cat release-name.txt

          echo "Release body:"
          cat release-body.md

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"

          mkdir -p cnb_upload

          echo "Download GitHub Release assets..."
          gh release download "$TAG" \
            --repo "$GH_REPO" \
            --dir cnb_upload \
            --clobber

          echo "Downloaded assets:"
          find cnb_upload -type f -print

      - name: Download GitHub source archives
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"

          ZIP_URL="$(cat source-zip-url.txt)"
          TAR_URL="$(cat source-tar-url.txt)"

          echo "Download source code zip..."
          curl -L "$ZIP_URL" -o "cnb_upload/Source code (zip).zip"

          echo "Download source code tar.gz..."
          curl -L "$TAR_URL" -o "cnb_upload/Source code (tar.gz).tar.gz"

          echo "Final upload files:"
          find cnb_upload -type f -print

      - name: Create CNB Release
        uses: docker://docker.cnb.cool/looc/git-cnb:latest
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        with:
          args: >-
            sh -c "
            set -e;
            TAG=\"${{ steps.tag.outputs.tag }}\";
            NAME=\$(cat release-name.txt);
            echo \"Create CNB release\";
            echo \"Repo: ${{ secrets.CNB_REPO }}\";
            echo \"Tag: \$TAG\";
            echo \"Name: \$NAME\";
            git-cnb --repo=${{ secrets.CNB_REPO }} release create -t \"\$TAG\" -n \"\$NAME\" -d release-body.md || true
            "

      - name: Upload assets to CNB Release
        uses: docker://docker.cnb.cool/looc/git-cnb:latest
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        with:
          args: >-
            sh -c "
            set -e;
            TAG=\"${{ steps.tag.outputs.tag }}\";
            echo \"Upload assets to CNB release: \$TAG\";
            find cnb_upload -type f | while read file; do
              echo \"Uploading: \$file\";
              git-cnb --repo=${{ secrets.CNB_REPO }} release asset-upload -t \"\$TAG\" -f \"\$file\";
            done
            "
