name: Sync to CNB Release

run-name: Sync GitHub Release ${{ inputs.tag || github.event.workflow_run.head_branch }} to CNB

on:
  workflow_run:
    workflows: ["Build (Releases)"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 GitHub Release Tag，例如 2.0.1 或 v2.0.1"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sync-to-cnb:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
          pip install requests tqdm

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Manual trigger tag: $TAG"
          else
            echo "Auto trigger from workflow_run"

            TAG="${{ github.event.workflow_run.head_branch }}"

            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "The completed Build (Releases) run did not provide a release tag"
              exit 1
            fi

            echo "Release tag from completed Build (Releases) run: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get GitHub Release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"

          echo "Get GitHub release info: $TAG"

          gh release view "$TAG" \
            --repo "$GH_REPO" \
            --json tagName,name,body,targetCommitish,zipballUrl,tarballUrl,isPrerelease,isDraft \
            > release.json

          RELEASE_NAME="$(jq -r '.name // .tagName' release.json)"
          TARGET_COMMITISH="$(jq -r '.targetCommitish // "main"' release.json)"
          IS_PRERELEASE="$(jq -r '.isPrerelease // false' release.json)"
          IS_DRAFT="$(jq -r '.isDraft // false' release.json)"

          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$TARGET_COMMITISH" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          
          echo "Release name: $RELEASE_NAME"
          echo "Target commitish: $TARGET_COMMITISH"

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"

          mkdir -p cnb_upload

          echo "Download GitHub Release assets..."
          gh release download "$TAG" \
            --repo "$GH_REPO" \
            --dir cnb_upload \
            --clobber

          echo "Downloaded assets:"
          find cnb_upload -type f -print

      - name: Download GitHub source archives
        run: |
          set -e

          TAG="${{ steps.tag.outputs.tag }}"
          
          ZIP_URL="$(jq -r '.zipballUrl' release.json)"
          TAR_URL="$(jq -r '.tarballUrl' release.json)"

          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ] ||
             [ -z "$TAR_URL" ] || [ "$TAR_URL" = "null" ]; then
            echo "GitHub release source archive URLs are missing"
            exit 1
          fi

          echo "Download source code zip..."
          curl --fail --location --show-error "$ZIP_URL" -o "cnb_upload/SkiHide-$TAG-source.zip"

          echo "Download source code tar.gz..."
          curl --fail --location --show-error "$TAR_URL" -o "cnb_upload/SkiHide-$TAG-source.tar.gz"

          echo "Final upload files:"
          find cnb_upload -type f -print

      - name: Sync to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ secrets.CNB_REPO }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          TARGET_COMMITISH: ${{ steps.release.outputs.target_commitish }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
          RELEASE_DRAFT: ${{ steps.release.outputs.is_draft }}
        run: |
          cat << 'EOF' > sync_cnb.py
          #!/usr/bin/env python3
          import os
          import json
          import requests
          import sys
          from pathlib import Path
          from tqdm import tqdm

          class CNBUploader:
              def __init__(self, token, base_url="https://api.cnb.cool"):
                  self.token = token
                  self.base_url = base_url
                  self.headers = {
                      'Accept': 'application/vnd.cnb.api+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'CNB-Release-Uploader/1.0.0',
                  }

              def create_release(self, project_path, release_data):
                  url = f"{self.base_url}/{project_path}/-/releases"
                  
                  print(f"\n📋 创建 Release 请求:")
                  print(f"   URL: {url}")
                  print(f"   数据: {json.dumps(release_data, indent=2, ensure_ascii=False)}")
                  
                  try:
                      response = requests.post(url, headers=self.headers, json=release_data)
                      
                      print(f"   响应状态码: {response.status_code}")
                      
                      if response.status_code == 409:
                          print(f"⚠️  Release 已存在，更新现有 Release 的标题和说明")
                          existing = self.get_release(project_path, release_data['tag_name'])
                          if not existing:
                              return None
                          return self.update_release(project_path, existing['id'], {
                              'name': release_data['name'],
                              'body': release_data['body'],
                              'draft': release_data['draft'],
                              'prerelease': release_data['prerelease'],
                          })
                      
                      response.raise_for_status()
                      release_info = response.json()
                      print(f"✅ Release创建成功: {release_info.get('name')}")
                      return release_info
                      
                  except requests.exceptions.RequestException as e:
                      print(f"❌ 创建release失败: {e}")
                      if hasattr(e, 'response') and e.response:
                          print(f"   状态码: {e.response.status_code}")
                          print(f"   响应: {e.response.text}")
                      return None

              def get_release(self, project_path, tag_name):
                  url = f"{self.base_url}/{project_path}/-/releases/tags/{tag_name}"
                  try:
                      response = requests.get(url, headers=self.headers)
                      response.raise_for_status()
                      return response.json()
                  except requests.exceptions.RequestException as e:
                      print(f"❌ 获取 Release 失败: {e}")
                      if e.response is not None:
                          print(f"   响应: {e.response.text}")
                      return None

              def update_release(self, project_path, release_id, release_data):
                  url = f"{self.base_url}/{project_path}/-/releases/{release_id}"
                  try:
                      response = requests.patch(url, headers=self.headers, json=release_data)
                      response.raise_for_status()
                      print("✅ Release 标题和说明已更新")
                      return self.get_release(project_path, release_data.get('tag_name', os.environ['RELEASE_TAG']))
                  except requests.exceptions.RequestException as e:
                      print(f"❌ 更新 Release 失败: {e}")
                      if e.response is not None:
                          print(f"   响应: {e.response.text}")
                      return None

              def get_upload_url(self, project_path, release_id, asset_name, file_size):
                  url = f"{self.base_url}/{project_path}/-/releases/{release_id}/asset-upload-url"
                  data = {"asset_name": asset_name, "overwrite": True, "size": file_size, "ttl": 0}
                  
                  try:
                      response = requests.post(url, headers=self.headers, json=data)
                      response.raise_for_status()
                      return response.json()
                  except requests.exceptions.RequestException as e:
                      print(f"❌ 获取上传URL失败 ({asset_name}): {e}")
                      if hasattr(e, 'response') and e.response:
                          print(f"   响应: {e.response.text}")
                      return None

              def upload_file(self, upload_info, file_path):
                  file_size = os.path.getsize(file_path)
                  file_name = os.path.basename(file_path)
                  upload_url = upload_info['upload_url']
                  verify_url = upload_info.get('verify_url')

                  if not verify_url:
                      print(f"❌ CNB 未返回附件确认地址 ({file_name})")
                      return False
                  
                  with open(file_path, 'rb') as f:
                      with tqdm(total=file_size, unit='B', unit_scale=True, desc=f"📤 {file_name}") as pbar:
                          class TqdmUpload:
                              def __init__(self, file, pbar, size):
                                  self.file = file
                                  self.pbar = pbar
                                  self.size = size
                              def read(self, size=-1):
                                  data = self.file.read(size)
                                  self.pbar.update(len(data))
                                  return data
                              def __len__(self):
                                  return self.size
                          
                          try:
                              response = requests.put(
                                  upload_url,
                                  headers={
                                      'Content-Type': 'application/octet-stream',
                                      'Content-Length': str(file_size),
                                  },
                                  data=TqdmUpload(f, pbar, file_size),
                              )
                              response.raise_for_status()

                              if verify_url.startswith('/'):
                                  verify_url = f"{self.base_url}{verify_url}"

                              confirm = requests.post(verify_url, headers=self.headers)
                              confirm.raise_for_status()
                              print(f"✅ 上传并确认成功: {file_name}")
                              return True
                          except requests.exceptions.RequestException as e:
                              print(f"❌ 上传失败 ({file_name}): {e}")
                              if e.response is not None:
                                  print(f"   响应: {e.response.text}")
                              return False

          def main():
              token = os.environ['CNB_TOKEN']
              repo = os.environ['CNB_REPO']
              tag = os.environ['RELEASE_TAG']
              name = os.environ.get('RELEASE_NAME', tag)
              target_commitish = os.environ.get('TARGET_COMMITISH', 'main')
              prerelease = os.environ.get('RELEASE_PRERELEASE', 'false').lower() == 'true'
              draft = os.environ.get('RELEASE_DRAFT', 'false').lower() == 'true'
              
              with open('release.json', 'r', encoding='utf-8') as f:
                  release_data = json.load(f)
              
              body = release_data.get('body', '')
              
              uploader = CNBUploader(token)
              
              # 创建 release（必须包含 target_commitish）
              print(f"\n🚀 开始同步 Release: {name} ({tag})")
              release_info = uploader.create_release(repo, {
                  'tag_name': tag,
                  'name': name,
                  'body': body,
                  'target_commitish': target_commitish,
                  'prerelease': prerelease,
                  'draft': draft,
              })
              
              if not release_info:
                  print("❌ 无法创建或获取 release")
                  sys.exit(1)
              
              release_id = release_info.get('id')
              if not release_id:
                  print("❌ 无法获取 release ID")
                  sys.exit(1)
              
              print(f"✅ Release ID: {release_id}")
              
              # 上传文件
              upload_dir = Path('cnb_upload')
              files = sorted([f for f in upload_dir.glob('*') if f.is_file()])
              
              if not files:
                  print("⚠️  没有文件需要上传")
                  return 0
              
              print(f"\n📦 准备上传 {len(files)} 个文件")
              
              success = 0
              for i, file_path in enumerate(files, 1):
                  file_size = file_path.stat().st_size
                  asset_name = file_path.name
                  
                  print(f"\n[{i}/{len(files)}] 处理: {asset_name} ({file_size:,} bytes)")
                  
                  upload_info = uploader.get_upload_url(repo, release_id, asset_name, file_size)
                  if upload_info and 'upload_url' in upload_info and 'verify_url' in upload_info:
                      if uploader.upload_file(upload_info, str(file_path)):
                          success += 1
                  else:
                      print(f"❌ CNB 未返回完整的上传信息: {asset_name}")

              visible_release = uploader.get_release(repo, tag)
              visible_assets = {
                  asset.get('name')
                  for asset in (visible_release or {}).get('assets', [])
              }
              expected_assets = {file_path.name for file_path in files}
              missing_assets = sorted(expected_assets - visible_assets)

              if missing_assets:
                  print(f"❌ 以下附件上传后仍未出现在 CNB Release: {', '.join(missing_assets)}")
                  return 1
              
              print(f"\n{'='*50}")
              print(f"🎉 完成! 成功上传并确认 {success}/{len(files)} 个文件")
              print(f"{'='*50}")
              
              return 0 if success == len(files) else 1

          if __name__ == '__main__':
              sys.exit(main())
          EOF

          python3 sync_cnb.py


